name: verify
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'branch to build and test'
        required: true
        type: string
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
      - name: deps
        run: sudo apt-get update && sudo apt-get install -y cmake libssl-dev zlib1g-dev libbz2-dev liblzma-dev libzstd-dev
      - name: build
        run: |
          cmake -B build -DBUILD_REGRESS_TESTS=ON -DENABLE_OPENSSL=ON
          cmake --build build -j"$(nproc)"
      - name: run regress tests
        run: ctest --test-dir build --output-on-failure 2>&1 | tail -25
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
      - name: deps
        run: sudo apt-get update && sudo apt-get install -y clang cmake libssl-dev zlib1g-dev libbz2-dev liblzma-dev libzstd-dev
      - name: asan and ubsan build and tests
        run: |
          CC=clang CXX=clang++ cmake -B build -DBUILD_REGRESS_TESTS=ON \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g -O1" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g -O1" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build -j"$(nproc)"
          sudo -E env ASAN_OPTIONS=detect_leaks=0 ctest --test-dir build --output-on-failure 2>&1 | tail -30
          echo "=== LEAK CHECK: compress_stream_leak with leak detection on ==="
          sudo -E env ASAN_OPTIONS=detect_leaks=1 ./build/regress/compress_stream_leak; echo "leak check exit code: $?"
